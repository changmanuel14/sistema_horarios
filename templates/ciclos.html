{% extends 'base.html' %}
{% block content %}
<h2>Ciclos</h2>
<form class="crud-form" onsubmit="return enviarCiclo(event)">
    <label>Nombre: <input type="text" name="nombre" required placeholder="Ej: 2026-II"></label>
    <label>Fecha inicio: <input type="date" name="fecha_inicio" required></label>
    <label>Fecha fin: <input type="date" name="fecha_fin" required></label>
    <button type="submit">Guardar</button>
</form>
<table class="lista">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Inicio</th>
        <th>Fin</th>
        <th>Acción</th>
    </tr>
    {% for c in ciclos %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.nombre }}</td>
        <td>{{ c.fecha_inicio }}</td>
        <td>{{ c.fecha_fin }}</td>
        <td><a href="{{ url_for('horario', ciclo_id=c.id) }}">Abrir horario</a></td>
    </tr>
    {% endfor %}
</table>
<script>
    async function enviarCiclo(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        await fetch('/ciclos', { method: 'POST', body: fd });
        location.reload();
    }
</script>
{% endblock %}
