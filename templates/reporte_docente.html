{% extends 'base.html' %}
{% block content %}
<h2>👨‍🏫 Horario por Docente - {{ ciclo.nombre }}</h2>

<div class="reporte-controls">
    <label>Selecciona un docente:
        <select id="sel-docente-reporte">
            <option value="">-- Seleccionar docente --</option>
        </select>
    </label>
    <div id="acciones-descarga" class="hidden">
        <a id="btn-descargar-pdf" class="btn-download btn-pdf" target="_blank">📄 Descargar PDF</a>
    </div>
</div>

<div id="horario-reporte"></div>

<script>
    const cicloId = {{ ciclo.id }};

    document.addEventListener('DOMContentLoaded', async () => {
        const sel = document.getElementById('sel-docente-reporte');
        const $sel = window.jQuery ? window.jQuery(sel) : null;

        // 1. Cargar docentes
        try {
            const res = await fetch('/api/docentes');
            const docentes = await res.json();

            sel.innerHTML = '<option value="">-- Seleccionar docente --</option>' +
                docentes.map(d => `<option value="${d.id}">${d.nombre}</option>`).join('');
        } catch (err) {
            console.error('Error al cargar docentes:', err);
            document.getElementById('horario-reporte').innerHTML =
                '<p class="vacio">No se pudieron cargar los docentes.</p>';
        }

        // 2. Inicializar Select2 UNA SOLA VEZ, después de llenar las opciones
        if ($sel && window.jQuery.fn.select2) {
            $sel.select2({
                placeholder: 'Buscar docente por nombre...',
                allowClear: true,
                width: '100%',
                language: {
                    noResults: () => 'No se encontraron docentes',
                    searching: () => 'Buscando...',
                    inputTooShort: () => 'Escribe para buscar',
                    errorLoading: () => 'No se pudieron cargar los resultados'
                }
            });
        }

        // 3. Detectar cambios (selección manual o limpieza con la ×)
        if ($sel) {
            $sel.on('change', function () {
                cargarHorario(this.value);
            });
        } else {
            // Respaldo si el CDN no cargó: sigue funcionando como select normal
            sel.addEventListener('change', e => cargarHorario(e.target.value));
        }

        // 4. Si la URL trae un docente (?docente=5), seleccionarlo automáticamente
        const params = new URLSearchParams(window.location.search);
        const docenteId = params.get('docente');

        if (docenteId) {
            if ($sel) {
                $sel.val(docenteId).trigger('change');
            } else {
                sel.value = docenteId;
                cargarHorario(docenteId);
            }
        }
    });

    async function cargarHorario(docenteId) {
        const contenedor = document.getElementById('horario-reporte');
        const acciones = document.getElementById('acciones-descarga');

        // Si se limpió la selección, vaciar la vista
        if (!docenteId) {
            contenedor.innerHTML = '';
            acciones.classList.add('hidden');
            return;
        }

        contenedor.innerHTML = '<p class="cargando">⏳ Cargando horario...</p>';

        try {
            const res = await fetch(`/api/reporte/docente/${cicloId}/${docenteId}`);
            if (!res.ok) throw new Error('No se pudo cargar el horario');
            const data = await res.json();

            // Configurar descarga
            document.getElementById('btn-descargar-pdf').href =
                `/descargar/pdf/docente/${cicloId}/${docenteId}`;
            acciones.classList.remove('hidden');

            if (data.asignaciones.length === 0) {
                contenedor.innerHTML =
                    `<h3>${data.docente}</h3>
         <p class="vacio">Este docente no tiene asignaciones en este ciclo.</p>`;
                return;
            }

            const horasUnicas = [...new Set(data.asignaciones.map(a => a.hora_inicio))].sort();

            let html = `<h3>${data.grado ? data.grado + ' ' : ''}${data.docente}</h3>`;
            if (data.correo) html += `<p class="correo-docente">📧 ${data.correo}</p>`;

            html += '<table class="horario-reporte-tabla"><thead><tr><th>Hora</th>';
            const dias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            dias.forEach(d => html += `<th>${d}</th>`);
            html += '</tr></thead><tbody>';

            horasUnicas.forEach(h => {
                const ref = data.asignaciones.find(a => a.hora_inicio === h);
                html += `<tr><td class="hora-label">${h} - ${ref ? ref.hora_fin : ''}</td>`;

                for (let d = 1; d <= 7; d++) {
                    const items = data.asignaciones.filter(a => a.dia == d && a.hora_inicio === h);

                    if (items.length > 0) {
                        const contenido = items.map(it =>
                            `<strong>${it.curso}</strong><br>${it.carrera} ${it.seccion}<br><em>${it.modalidad}</em>`
                        ).join('<hr>');
                        html += `<td>${contenido}</td>`;
                    } else {
                        html += '<td></td>';
                    }
                }
                html += '</tr>';
            });

            html += '</tbody></table>';
            contenedor.innerHTML = html;

        } catch (err) {
            contenedor.innerHTML = `<p class="error">❌ ${err.message}</p>`;
            acciones.classList.add('hidden');
        }
    }
</script>
{% endblock %}
