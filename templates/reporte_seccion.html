{% extends 'base.html' %}
{% block content %}
<h2>📅 Horario de Sección - {{ ciclo.nombre }}</h2>

<div class="reporte-controls">
    <label>Selecciona una sección:
        <select id="sel-seccion-reporte" onchange="cargarHorario(this.value)">
            <option value="">-- Seleccionar --</option>
        </select>
    </label>
    <div id="acciones-descarga" class="hidden">
        <a id="btn-descargar-pdf" class="btn-download btn-pdf" target="_blank">📄 Descargar PDF</a>
        <a id="btn-descargar-excel" class="btn-download btn-excel" target="_blank">📊 Descargar Excel</a>
    </div>
</div>

<div id="horario-reporte"></div>

<script>
    const cicloId = {{ ciclo.id }};

    document.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch(`/api/horario/secciones/${cicloId}`);
        const secciones = await res.json();
        const sel = document.getElementById('sel-seccion-reporte');
        sel.innerHTML = '<option value="">-- Seleccionar --</option>' +
            secciones.map(s => `<option value="${s.seccion_id}">${s.carrera} - Sem ${s.semestre} - Sec ${s.seccion}</option>`).join('');

        // Si viene por URL, cargar automáticamente
        const params = new URLSearchParams(window.location.search);
        const seccionId = params.get('seccion');
        if (seccionId) {
            sel.value = seccionId;
            cargarHorario(seccionId);
        }
    });

    async function cargarHorario(seccionId) {
        const contenedor = document.getElementById('horario-reporte');
        const acciones = document.getElementById('acciones-descarga');

        if (!seccionId) {
            contenedor.innerHTML = '';
            acciones.classList.add('hidden');
            return;
        }

        const res = await fetch(`/api/reporte/seccion/${cicloId}/${seccionId}`);
        const data = await res.json();

        document.getElementById('btn-descargar-pdf').href = `/descargar/pdf/seccion/${cicloId}/${seccionId}`;
        document.getElementById('btn-descargar-excel').href = `/descargar/excel/${cicloId}/${seccionId}`;
        acciones.classList.remove('hidden');

        // Construir grilla
        const horasUnicas = [...new Set(data.bloques.filter(b => b.tipo === 'clase').map(b => b.hora_inicio))].sort();

        let html = `<h3>${data.seccion}</h3>`;
        html += '<table class="horario-reporte-tabla"><thead><tr><th>Hora</th>';
        const dias = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
        dias.forEach(d => html += `<th>${d}</th>`);
        html += '</tr></thead><tbody>';

        horasUnicas.forEach(h => {
            const bloqueRef = data.bloques.find(b => b.hora_inicio === h);
            html += `<tr><td class="hora-label">${h} - ${bloqueRef.hora_fin}</td>`;
            for (let d = 1; d <= 7; d++) {
                const asignacion = data.asignaciones.find(a => a.dia === d && a.hora_inicio === h);
                if (asignacion) {
                    const claseColor = {
                        'Presencial': 'bg-presencial',
                        'Virtual': 'bg-virtual',
                        'Lab. Escuela': 'bg-lab-escuela',
                        'Lab. Radiología': 'bg-lab-radiologia'
                    }[asignacion.modalidad] || '';
                    html += `<td class="${claseColor}"><strong>${asignacion.curso}</strong><br>${asignacion.docente}<br><em>${asignacion.modalidad}</em></td>`;
                } else {
                    html += '<td></td>';
                }
            }
            html += '</tr>';
        });
        html += '</tbody></table>';

        contenedor.innerHTML = html;
    }
</script>
{% endblock %}
